<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overdriveauto Ops</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E5A4A">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<style>
/* ===== Operations site: sidebar console on desktop, bottom tabs on phones ===== */
.o-app{min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr);background:var(--bg)}
.o-side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px;padding:16px 12px}
.o-brand{display:flex;align-items:center;gap:8px;padding:4px 8px 14px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:16px;line-height:1;letter-spacing:-.02em;white-space:nowrap;min-width:0}
.o-brand > span{min-width:0;overflow:hidden}
.o-brand em{flex:none}
.o-brand svg{width:40px;height:26px;flex:none}
.o-side .o-brand{font-size:15.5px;font-stretch:100%;gap:7px}
.o-side .o-brand svg{width:34px;height:22px}
.o-brand i{font-style:normal;font-weight:400}
.o-brand em{font-style:normal;font-family:var(--f-body);font-stretch:100%;font-size:12px;font-weight:800;letter-spacing:0;background:var(--tag);color:var(--on-tag);padding:3px 6px;border-radius:3px}
.o-nav{display:grid;gap:2px}
.o-navlink{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:none;color:var(--ink);font-weight:600;font-size:15px;text-align:left;text-decoration:none;cursor:pointer}
.o-navlink:hover{background:var(--surface-2)}
.o-navlink[aria-current="page"]{background:var(--brand-soft)}
.o-navlink svg{width:20px;height:20px;color:var(--muted);flex:none}
.o-navlink[aria-current="page"] svg{color:var(--brand)}
.o-badge{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--tag);color:var(--on-tag);font-size:12px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.o-side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:8px;display:grid;gap:2px}
.o-top{display:none}
.o-wrap{min-width:0}
.o-main,.o-stack,.o-panel,.o-dr-body{grid-template-columns:minmax(0,1fr)}
.o-panel > *,.o-stack > *{min-width:0}
.o-head > *{min-width:0}
.o-app .chip svg{width:16px;height:16px;flex:none}
.o-tpls .chip{text-decoration:none}
.o-main{width:100%;max-width:1280px;margin:0 auto;padding:26px 28px 56px;display:grid;gap:18px;align-content:start;min-width:0}
.o-main:focus{outline:none}
.o-tabs{display:none}
.o-app.o-gated .o-nav,.o-app.o-gated .o-tabs{display:none!important}
@media (max-width:860px){
  .o-app{grid-template-columns:minmax(0,1fr)}
  .o-side{display:none}
  .o-top{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;justify-content:space-between;gap:10px}
  .o-top .o-brand{padding:0;font-size:clamp(18px,5.6vw,21px);min-width:0;overflow:hidden}
  .o-top .o-brand svg{width:36px;height:24px}
  .o-back{flex:none}
  .o-main{padding:16px 16px calc(92px + env(safe-area-inset-bottom,0px))}
  .o-tabs{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
}
.o-tab{position:relative;display:grid;justify-items:center;gap:2px;padding:6px 2px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer;border-radius:8px}
.o-tab svg{width:22px;height:22px}
.o-tab[aria-current="page"]{color:var(--brand)}
.o-dot{position:absolute;top:1px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--tag);color:var(--on-tag);font-size:11px;font-weight:700;display:grid;place-items:center}
.o-back{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.o-back svg{width:16px;height:16px}

/* Page heads and panels */
.o-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
.o-head h1{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(1.7rem,3vw,2.2rem);line-height:1.05;margin:0;letter-spacing:-.025em}
.o-head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.o-stack{display:grid;gap:16px;min-width:0}
.o-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;align-content:start;min-width:0}
.o-panel h2{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:17px;font-weight:700;line-height:1.3;margin:0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.o-panel h2 small{font-size:13px;font-weight:500;color:var(--muted)}
.o-grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media (max-width:1040px){.o-grid2{grid-template-columns:minmax(0,1fr)}}
.o-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1.5;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.o-pill.good{background:var(--dar-soft);color:var(--dar)}
.o-pill.warn{background:var(--tag);color:var(--on-tag)}
.o-pill.bad{background:var(--danger-soft);color:var(--danger)}
.o-pill.info{background:var(--brand-soft);color:var(--ink)}
.o-ex{font-size:11.5px;font-weight:600;border:1px dashed var(--muted);padding:0 5px;border-radius:4px;color:var(--muted);white-space:nowrap}
.o-mono{font-family:var(--f-body);font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.o-empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;background:var(--surface);display:grid;gap:10px;justify-items:start}
.o-empty h3{margin:0;font-size:19px}
.o-empty p{margin:0;color:var(--muted);max-width:56ch}

/* Stat tiles */
.o-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.o-stats .o-stat:first-child{grid-column:span 2}
@media (min-width:1400px){.o-stats{grid-template-columns:repeat(5,minmax(0,1fr))}.o-stats .o-stat:first-child{grid-column:auto}}
@media (max-width:620px){.o-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.o-stats .o-stat:first-child{grid-column:1/-1}}
.o-stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:3px;align-content:start;min-width:0}
.o-stat .l{font-size:13px;color:var(--muted);font-weight:600}
.o-stat .l em{font-style:normal;font-weight:500;font-size:11.5px;letter-spacing:.04em;margin-left:4px}
.o-stat .v{font-size:26px;font-weight:700;line-height:1.15;white-space:nowrap}
.o-stat:first-child .v{font-size:34px}
@media (max-width:620px){.o-stat .v{font-size:22px}.o-stat:first-child .v{font-size:30px}}
.o-stat .s{font-size:12.5px;color:var(--muted)}

/* Attention list */
.o-attn{list-style:none;margin:0;padding:0;display:grid}
.o-attn button{width:100%;display:flex;align-items:center;gap:12px;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font-size:15px;text-align:left;cursor:pointer}
.o-attn li:last-child button{border-bottom:0}
.o-attn button:hover .t{text-decoration:underline}
.o-attn .n{min-width:34px;height:34px;padding:0 6px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--surface-2);font-variant-numeric:tabular-nums;flex:none}
.o-attn .n.warn{background:var(--tag);color:var(--on-tag)}
.o-attn .n.bad{background:var(--danger-soft);color:var(--danger)}
.o-attn .t{font-weight:600}
.o-attn small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.o-attn svg{width:18px;height:18px;color:var(--muted);margin-left:auto;flex:none}

/* Charts */
.o-cols{position:relative;height:170px;display:flex;align-items:flex-end;gap:2px;padding-left:46px;margin-top:6px}
.o-gl{position:absolute;left:46px;right:0;height:0;border-top:1px solid var(--line);pointer-events:none}
.o-gl b{position:absolute;right:calc(100% + 6px);top:0;transform:translateY(-50%);font-size:11.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.o-col{position:relative;z-index:1;flex:1 1 0;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:4px}
.o-col span{display:block;width:min(100%,24px);background:var(--brand);border-radius:4px 4px 0 0}
.o-col:hover span,.o-col:focus-visible span{background:var(--brand-hover)}
.o-col:hover{background:var(--surface-2)}
.o-xlab{display:flex;justify-content:space-between;padding-left:46px;margin-top:6px;font-size:12px;color:var(--muted)}
.o-hbars{display:grid;gap:10px}
.o-hbar{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;border-radius:6px;padding:2px 0}
.o-hbar:hover{background:var(--surface-2)}
.o-hl{display:flex;align-items:center;gap:7px;font-weight:600}
.o-ht{height:16px;display:flex;align-items:center}
.o-hf{height:16px;background:var(--brand);border-radius:0 4px 4px 0;min-width:0}
.o-hv{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.o-tip{position:fixed;z-index:80;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.35;pointer-events:none;box-shadow:var(--shadow);max-width:240px}
.o-tip b{display:block;font-weight:700}
.o-srcdot{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}

/* Tables */
.o-tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.o-table{width:100%;border-collapse:collapse;font-size:14px}
.o-table th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.o-table td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.o-table tr:last-child td{border-bottom:0}
.o-table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.o-table tbody tr[data-order]{cursor:pointer}
.o-table tbody tr[data-order]:hover td{background:var(--surface-2)}
.o-table tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.o-sub{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.o-link{border:0;background:none;padding:0;font:inherit;color:var(--ink);font-family:var(--f-body);font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Orders */
.o-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.o-search{position:relative;flex:1 1 280px;min-width:0}
.o-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.o-search .input{padding-left:40px}
.o-tools select{width:auto;flex:0 0 auto}
.o-board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(252px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.o-colm{background:var(--surface-2);border-radius:var(--r);padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.o-colm h3{margin:2px 4px 2px;font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.o-colm .none{font-size:13px;color:var(--muted);padding:6px 4px}
.o-cards{display:grid;gap:10px}
.o-card{display:grid;gap:5px;width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer;min-width:0}
.o-card:hover{border-color:var(--brand)}
.o-card .top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.o-card .top .ago{margin-left:auto;white-space:nowrap}
.o-card .no{font-family:var(--f-body);font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);font-size:13px}
.o-card .who{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.o-card .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.o-card .amt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.o-next{font-size:12.5px;color:var(--brand);font-weight:600}
.o-new{box-shadow:inset 3px 0 0 var(--tag)}
.o-only-narrow{display:none}
@media (max-width:760px){.o-only-wide{display:none}.o-only-narrow{display:grid}}

/* Order drawer */
.o-scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.o-drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:50;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .22s ease-out}
@media (prefers-reduced-motion:reduce){.o-drawer{animation:none}}
.o-dr-head{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.o-dr-head h2{font-family:var(--f-body);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;text-transform:none;letter-spacing:0;margin:0}
.o-dr-head .x{margin-left:auto}
.o-dr-body{flex:1;min-height:0;overflow:auto;padding:16px 18px 32px;display:grid;gap:14px;align-content:start}
.o-statusline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.o-steps{list-style:none;margin:4px 0 0;padding:0;display:grid}
.o-steps li{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:5px 0;font-size:14px;color:var(--muted)}
.o-steps li::before{content:"";position:absolute;left:6px;top:22px;bottom:-6px;width:2px;background:var(--line)}
.o-steps li:last-child::before{display:none}
.o-steps .d{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:3px;position:relative;z-index:1}
.o-steps li.done{color:var(--ink)}
.o-steps li.done .d{background:var(--brand);border-color:var(--brand)}
.o-steps li.done::before{background:var(--brand)}
.o-steps li.cur{color:var(--ink);font-weight:700}
.o-steps li.cur .d{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.o-steps time{font-size:12.5px;white-space:nowrap}
.o-kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:14.5px}
.o-kv dt{color:var(--muted)}
.o-kv dd{margin:0;font-weight:600;overflow-wrap:anywhere;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.o-kv dd a{color:var(--ink)}
.o-tpls{display:flex;gap:8px;flex-wrap:wrap}
.o-tpls a{text-decoration:none}
.o-costin{width:110px;height:36px;padding:0 8px;text-align:right;font-variant-numeric:tabular-nums}
.o-est{font-size:11px;color:var(--muted);font-weight:500}
.o-sum{display:grid;gap:5px;font-variant-numeric:tabular-nums;font-size:14.5px}
.o-sum div{display:flex;justify-content:space-between;gap:12px}
.o-sum .tot{font-weight:700;font-size:16px;border-top:1px solid var(--line);padding-top:7px}
.o-sum .pos{color:var(--dar);font-weight:700}
.o-progress{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.o-progress span{display:block;height:100%;background:var(--dar);border-radius:999px}
.o-pay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.o-pay .full{grid-column:1/-1}
@media (max-width:460px){.o-pay{grid-template-columns:minmax(0,1fr)}}
.o-confirm{border:1px solid var(--danger);background:var(--danger-soft);border-radius:8px;padding:12px;display:grid;gap:10px}
.o-confirm p{margin:0;color:var(--ink)}
.btn-danger{background:var(--danger);color:var(--surface)}
.o-plain{border:0;background:none;padding:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;justify-self:start}

/* Requests, sellers, stock, costs */
.o-reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
@media (max-width:420px){.o-reqs{grid-template-columns:minmax(0,1fr)}}
.o-req{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start;min-width:0}
.o-req .top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.o-req .top .ago{margin-left:auto}
.o-req h3{margin:0;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.o-req p{margin:0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.o-req p.who{color:var(--ink)}
.o-req p.who a{color:var(--ink);font-weight:600}
.o-quote{background:var(--brand-soft);border-radius:8px;padding:8px 10px;color:var(--ink)!important;font-weight:600}
.o-qform{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.o-qform .full{grid-column:1/-1}
@media (max-width:520px){.o-qform{grid-template-columns:minmax(0,1fr)}}
.o-stock{display:grid;gap:0}
.o-srow{display:grid;grid-template-columns:minmax(0,1.6fr) 150px 92px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.o-srow:last-child{border-bottom:0}
.o-srow.head{font-size:13px;color:var(--muted);font-weight:600;padding:4px 0 8px}
.o-srow .nm{font-weight:600;overflow-wrap:anywhere}
.o-srow .input{height:38px;text-align:center;padding:0 6px}
.o-step{display:flex;align-items:center;gap:4px}
.o-step button{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:18px;cursor:pointer;color:var(--ink);flex:none}
.o-step button:hover{background:var(--surface-2)}
.o-step .input{width:64px}
.o-srow .lbl{display:none;font-size:12px;color:var(--muted);font-weight:600}
@media (max-width:760px){
  .o-srow{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px}
  .o-srow.head{display:none}
  .o-srow .nm{grid-column:1/-1}
  .o-srow .lbl{display:block}
  .o-srow .res{grid-column:1/-1}
}
.o-costs .input{width:120px;height:36px;text-align:right;padding:0 8px}
.o-settings{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.o-settings{grid-template-columns:minmax(0,1fr)}}
.o-morelist{list-style:none;margin:0;padding:0;display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.o-morelist li + li{border-top:1px solid var(--line)}
.o-morelist .o-navlink{padding:16px;font-size:16px;border-radius:0}
.o-gate{display:grid;gap:14px;justify-items:start;max-width:560px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
.o-gate h1{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(1.7rem,5vw,2.2rem);line-height:1.05;margin:0;letter-spacing:-.025em}
.o-gate p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<div id="ops" class="o-app o-gated">
  <aside class="o-side" aria-label="Operations">

<script>
/* Connects the operations site to the shared catalogue, the database and sign-in. */
(function () {
  'use strict';
  const B = window.ODA_BASE, BE = window.ODA_BACKEND;
  const $ = s => document.querySelector(s);
  const esc = B.esc;

  let toastTimer;
  function toast(msg, action) {
    const t = $('#toast');
    t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button" id="toast-act">${esc(action.label)}</button>` : '');
    t.hidden = false;
    if (action) $('#toast-act').addEventListener('click', () => { t.hidden = true; action.fn(); });
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3800);
  }
  function copyText(text) {
    const ok = () => toast(`Copied ${text.length > 40 ? 'the message' : text}`);
    const fail = () => toast("Couldn't copy here. Press and hold the text to copy it.");
    try { navigator.clipboard.writeText(text).then(ok, fail); } catch (e) { fail(); }
  }
  document.addEventListener('click', e => { const c = e.target.closest('[data-copy-text]'); if (c) copyText(c.dataset.copyText); });

  const downloads = {
    async save({ filename, data }) {
      const url = URL.createObjectURL(new Blob([data], { type: 'text/csv;charset=utf-8' }));
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return { saved: true };
    }
  };

  let sb = null;
  async function connect() {
    if (sb) return sb;
    sb = await BE.client();
    sb.auth.onAuthStateChange(event => { if (event === 'SIGNED_OUT' && AUTH.signedIn) location.reload(); });
    return sb;
  }
  async function isAdmin() {
    const { data, error } = await sb.rpc('is_admin');
    return !error && data === true;
  }
  const AUTH = {
    configured: !!(BE && BE.configured()),
    signedIn: false,
    async restore() {
      try {
        await connect();
        const { data } = await sb.auth.getSession();
        if (!data || !data.session) return false;
        if (!(await isAdmin())) { await sb.auth.signOut(); return false; }
        AUTH.signedIn = true; return true;
      } catch (e) { return false; }
    },
    async signIn(email, password) {
      try {
        await connect();
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) return { ok: false, reason: /fetch|network/i.test(error.message || '') ? 'network' : 'credentials' };
        if (!(await isAdmin())) { await sb.auth.signOut(); return { ok: false, reason: 'notadmin' }; }
        AUTH.signedIn = true;
        return { ok: true };
      } catch (e) { return { ok: false, reason: 'network' }; }
    },
    async signOut() { AUTH.signedIn = false; try { await sb.auth.signOut(); } catch (e) { /* already signed out */ } },
    cloud() { return { db: BE.makeDb(sb), owner: true, downloads }; }
  };

  window.ODA = Object.assign({}, B, {
    toast, copyText, AUTH,
    CLOUD: Promise.resolve(null),
    closeDrawers() {},
    standalone: true,
    storeUrl: '../'
  });
})();
</script>
<script>
(function () {
'use strict';
const O = window.ODA;
if (!O) return;
const { PRODUCTS, byId, SRC, ALL_SRC, PAY, I, fmt, esc, toast, digits } = O;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const root = $('#ops'), main = $('#o-main'), drawer = $('#o-drawer'), scrim = $('#o-scrim'), tip = $('#o-tip');
const STORE_HOME = O.storeUrl || '#top', STORE_PARTS = O.storeUrl ? O.storeUrl + '#parts' : '#parts';

/* ---------- Icons ---------- */
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const OI = {
  overview: svg('<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>'),
  orders: svg('<path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/>'),
  requests: svg('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2M8.5 11h5M11 8.5v5"/>'),
  stock: svg('<path d="M4 20.5V3.5M20 20.5V3.5M4 9h16M4 15h16"/><rect x="7" y="5" width="4" height="4"/><rect x="13" y="11" width="4" height="4"/><rect x="6.5" y="17" width="5" height="3.5"/>'),
  sellers: svg('<path d="M4 9.5L5.5 4h13L20 9.5M4 9.5V20h16V9.5M4 9.5h16"/><path d="M9.5 20v-5h5v5"/>'),
  costs: svg('<path d="M20 12l-8 8-8-8V4h8z"/><circle cx="8.5" cy="8.5" r="1.3"/>'),
  settings: svg('<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>'),
  more: svg('<circle cx="5.5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18.5" cy="12" r="1.5"/>'),
  back: svg('<path d="M10 6l-6 6 6 6M4 12h16"/>'),
  chev: svg('<path d="M9 6l6 6-6 6"/>'),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),
  download: svg('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),
  close: svg('<path d="M6 6l12 12M18 6L6 18"/>')
};

/* ---------- Model ---------- */
const VIEWS = [
  { k: 'overview', label: 'Overview' },
  { k: 'orders', label: 'Orders' },
  { k: 'requests', label: 'Part requests', short: 'Requests' },
  { k: 'stock', label: 'Dar stock', short: 'Stock' },
  { k: 'sellers', label: 'Seller sign-ups', short: 'Sellers' },
  { k: 'costs', label: 'Costs and margins', short: 'Costs' },
  { k: 'settings', label: 'Settings' }
];
const TABS = ['overview', 'orders', 'requests', 'stock', 'more'];
const SRCSHORT = { dar: 'Dar', partner: 'Kariakoo', japan: 'Japan', canada: 'Canada', china: 'China' };
const COST_RATIO = { dar: 0.70, partner: 0.85, japan: 0.72, canada: 0.72, china: 0.60 };
const STAGES = [
  { k: 'new', label: 'New', next: 'Confirm order', doing: 'Check stock and fitment, then confirm with the customer.' },
  { k: 'confirmed', label: 'Confirmed', next: 'Record payment', doing: 'Waiting for the customer to pay.' },
  { k: 'paid', label: 'Paid', next: 'Mark packed', nextImp: 'Mark ordered from supplier', doing: 'Paid. Order the imported parts or pack the Dar stock.' },
  { k: 'ordered', label: 'Ordered', imp: true, next: 'Mark shipped', doing: 'Ordered from the supplier. Waiting for it to ship.' },
  { k: 'transit', label: 'In transit', imp: true, next: 'Mark arrived, now clearing', doing: 'On the way to Dar.' },
  { k: 'clearing', label: 'Clearing', imp: true, next: 'Mark cleared and packed', doing: 'At customs with the clearing agent.' },
  { k: 'ready', label: 'Ready', next: 'Send out for delivery', doing: 'Packed and ready to go out.' },
  { k: 'out', label: 'Out for delivery', next: 'Mark delivered', doing: 'With the rider or bus company.' },
  { k: 'delivered', label: 'Delivered', next: 'Close order', doing: 'Delivered. Collect any balance, then close the order.' },
  { k: 'closed', label: 'Closed', doing: 'Done.' }
];
const STAGE = Object.fromEntries(STAGES.map(s => [s.k, s]));
STAGE.cancelled = { k: 'cancelled', label: 'Cancelled', doing: 'Cancelled. Nothing more to do.' };
const PERIODS = [['today', 'Today'], ['7', '7 days'], ['30', '30 days'], ['month', 'This month'], ['all', 'All time']];
const REQ_STATUS = { new: 'New', quoted: 'Quoted', won: 'Won', lost: 'Lost' };
const SELL_STATUS = { new: 'New', contacted: 'Contacted', approved: 'Approved', declined: 'Declined' };

const st = {
  view: 'overview', period: '30', layout: window.innerWidth < 760 ? 'list' : 'board',
  orders: [], requests: [], sellers: [], stock: {}, costs: {}, settings: {},
  loaded: { orders: false, requests: false, sellers: false },
  orderFilter: 'active', srcFilter: 'all', q: '', reqFilter: 'open', sellerFilter: 'open', costQ: '',
  drawer: null, confirm: null, quoting: null, clearConfirm: false,
  db: null, downloads: null, started: false, gate: 'loading', seen: null, fresh: new Set(), pending: {}
};
try { const v = JSON.parse(localStorage.getItem('odauto:opsView') || 'null'); if (v && (VIEWS.some(x => x.k === v) || v === 'more')) st.view = v; } catch (e) {}

/* ---------- Helpers ---------- */
const num = v => (typeof v === 'number' && isFinite(v)) ? v : 0;
const sum = (arr, f) => arr.reduce((s, x) => s + num(f(x)), 0);
const isActive = o => o.status !== 'closed' && o.status !== 'cancelled';
const isImport = o => (o.items || []).some(i => SRC[i.src] && SRC[i.src].imported);
const stagesFor = o => STAGES.filter(s => !s.imp || isImport(o));
const stageIdx = (o, k) => stagesFor(o).findIndex(s => s.k === k);
function nextStage(o) { const l = stagesFor(o), i = l.findIndex(s => s.k === o.status); return i >= 0 && i < l.length - 1 ? l[i + 1] : null; }
function prevStage(o) { const l = stagesFor(o), i = l.findIndex(s => s.k === o.status); return i > 0 ? l[i - 1] : null; }
function nextLabel(o) { const s = STAGE[o.status]; if (!s) return ''; if (o.status === 'paid') return isImport(o) ? s.nextImp : s.next; return s.next || ''; }
const basePrice = i => (byId[i.pid] ? byId[i.pid].price : num(i.price));
function unitCost(i) {
  if (typeof i.cost === 'number') return i.cost;
  if (typeof st.costs[i.pid] === 'number') return st.costs[i.pid];
  return Math.round(basePrice(i) * (COST_RATIO[i.src] || 0.75) / 100) * 100;
}
const costIsEst = i => typeof i.cost !== 'number' && typeof st.costs[i.pid] !== 'number';
const partsOf = o => sum(o.items || [], i => num(i.price) * num(i.qty));
const profitOf = o => sum(o.items || [], i => (num(i.price) - unitCost(i)) * num(i.qty));
const paidOf = o => num(o.paid);
const balanceOf = o => Math.max(0, num(o.total) - paidOf(o));
const dueNowLeft = o => Math.max(0, num(o.dueNow) - paidOf(o));
const qtyOf = o => sum(o.items || [], i => i.qty);
const firstName = n => ((n || '').trim().split(/\s+/)[0]) || 'there';
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const n0 = n => Math.round(num(n)).toLocaleString('en-US');
function intl(phone) {
  let d = digits(phone);
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('0') && d.length === 10) d = '255' + d.slice(1);
  else if (d.length === 9 && /^[67]/.test(d)) d = '255' + d;
  return d;
}
const waTo = (phone, text) => 'https://wa.me/' + intl(phone) + (text ? '?text=' + encodeURIComponent(text) : '');
function ago(iso) {
  const t = Date.parse(iso); if (!t) return '';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60); if (h < 24) return h + ' h ago';
  const d = Math.round(h / 24); if (d < 7) return d + (d === 1 ? ' day ago' : ' days ago');
  return new Date(t).toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
}
const when = iso => { const t = Date.parse(iso); return t ? new Date(t).toLocaleString('en-CA', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : ''; };
function short(n) {
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (a >= 1e3) return Math.round(n / 1e3) + 'K';
  return String(Math.round(n));
}
function niceMax(v) { if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
function periodStart(p) {
  const n = new Date();
  if (p === 'today') return new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
  if (p === '7') return Date.now() - 7 * 864e5;
  if (p === '30') return Date.now() - 30 * 864e5;
  if (p === 'month') return new Date(n.getFullYear(), n.getMonth(), 1).getTime();
  return 0;
}
const srcTag = s => `<span class="o-srcdot" data-src="${esc(s)}"><span class="dot"></span>${esc(SRCSHORT[s] || s)}</span>`;
function statusPill(k) {
  const tone = k === 'new' ? 'warn' : k === 'cancelled' ? 'bad' : (k === 'closed' || k === 'delivered') ? 'good' : 'info';
  return `<span class="o-pill ${tone}">${esc((STAGE[k] || { label: k }).label)}</span>`;
}
const darProducts = () => PRODUCTS.filter(p => p.src === 'dar');
function stockRow(pid) { const s = st.stock[pid] || {}; return { qty: typeof s.qty === 'number' ? s.qty : null, min: typeof s.min === 'number' ? s.min : 2 }; }
function stockState(pid) { const r = stockRow(pid); if (r.qty === null) return 'untracked'; if (r.qty <= 0) return 'out'; if (r.qty <= r.min) return 'low'; return 'ok'; }
function reservedQty(pid) {
  return sum(st.orders.filter(o => isActive(o) && !o.stockDeducted), o => sum((o.items || []).filter(i => i.pid === pid), i => i.qty));
}
function matchesOrder(o, q) {
  if (!q) return true;
  const hay = [o.no, o.customer && o.customer.name, o.customer && o.customer.phone, o.customer && o.customer.area, o.vehicle, o.chassis, ...(o.items || []).map(i => i.name + ' ' + i.oem)].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

/* ---------- Writes (one at a time per document) ---------- */
const queues = {};
function write(path, kind, data) {
  const run = async () => {
    const ref = st.db.doc(path);
    const go = () => kind === 'set' ? ref.set(data) : kind === 'update' ? ref.update(data) : ref.delete();
    try { await go(); }
    catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 500 + Math.random() * 500)); await go(); } else throw e; }
  };
  const p = (queues[path] || Promise.resolve()).then(run, run);
  queues[path] = p.catch(() => {});
  return p.catch(e => {
    toast(e && e.code === 'quota_exceeded' ? 'Storage is full. Remove example data or old records, then try again.' : "Couldn't save that change. Check your connection and try again.");
    throw e;
  });
}
const timers = {};
function saveLater(key, fn, ms) { st.pending[key] = true; clearTimeout(timers[key]); timers[key] = setTimeout(async () => { try { await fn(); } catch (e) {} st.pending[key] = false; }, ms || 700); }
const writeStock = () => write('shared/stock', 'set', { items: st.stock, updatedAt: new Date().toISOString() });
const writeCosts = () => write('private/costs', 'set', { costs: st.costs, updatedAt: new Date().toISOString() });

/* ---------- Order actions ---------- */
async function moveStock(items, sign) {
  const next = JSON.parse(JSON.stringify(st.stock));
  let changed = false;
  items.forEach(i => { const r = next[i.pid]; if (!r || typeof r.qty !== 'number') return; r.qty = Math.max(0, r.qty + sign * num(i.qty)); changed = true; });
  if (!changed) return;
  st.stock = next;
  await write('shared/stock', 'set', { items: next, updatedAt: new Date().toISOString() });
}
async function setStatus(o, k, note) {
  const at = new Date().toISOString();
  const patch = { status: k, history: [...(o.history || []), Object.assign({ status: k, at }, note ? { note } : {})], updatedAt: at };
  const dar = (o.items || []).filter(i => i.src === 'dar');
  if (k === 'ready' && !o.stockDeducted && dar.length) { await moveStock(dar, -1); patch.stockDeducted = true; }
  else if (o.stockDeducted && (k === 'cancelled' || (stageIdx(o, k) >= 0 && stageIdx(o, k) < stageIdx(o, 'ready')))) { await moveStock(dar, +1); patch.stockDeducted = false; }
  await write('orders/' + o.id, 'update', patch);
  toast(`${o.no} moved to ${STAGE[k].label}`);
}
async function recordPayment(o, amount, method, note) {
  const at = new Date().toISOString();
  const payments = [...(o.payments || []), Object.assign({ amount, method, at }, note ? { note } : {})];
  const paid = sum(payments, p => p.amount);
  const patch = { payments, paid, updatedAt: at };
  let moved = false;
  if ((o.status === 'new' || o.status === 'confirmed') && paid >= num(o.dueNow)) { patch.status = 'paid'; patch.history = [...(o.history || []), { status: 'paid', at }]; moved = true; }
  await write('orders/' + o.id, 'update', patch);
  toast(`Recorded ${fmt(amount)} for ${o.no}${moved ? ' and moved it to Paid' : ''}`);
}
function templates(o) {
  const n = firstName(o.customer && o.customer.name), bal = balanceOf(o), due = dueNowLeft(o) || num(o.dueNow);
  const pay = (st.settings.payInfo || '').trim();
  const list = [{ label: 'Confirm and ask for payment', text: `Hi ${n}, this is Overdriveauto about order ${o.no}. We've checked your parts${o.vehicle ? ' against your ' + o.vehicle : ''} and everything is available. Total: ${fmt(o.total)}. Please pay ${fmt(due)} ${o.payMethod === 'cash' ? 'on delivery' : 'now'}${num(o.later) ? `. The balance of ${fmt(o.later)} is due when the imported parts arrive` : ''}.${pay && o.payMethod !== 'cash' ? '\n\n' + pay : ''}\n\nReply here if you have any questions.` }];
  list.push({ label: 'Payment received', text: `Thanks ${n}, we've received your payment for order ${o.no}. ${isImport(o) ? "We're ordering your parts now and will update you when they ship." : "We're packing your parts now."}` });
  if (isImport(o)) list.push({ label: 'Parts shipped', text: `Good news ${n}: the parts for order ${o.no} have shipped${o.supplier && o.supplier.tracking ? ' (tracking ' + o.supplier.tracking + ')' : ''}. We'll message you when they reach Dar.` });
  list.push({ label: 'Out for delivery', text: `Hi ${n}, order ${o.no} is out for delivery today${o.customer && o.customer.area ? ' to ' + o.customer.area : ''}.${bal ? ` Please have ${fmt(bal)} ready.` : ''}` });
  list.push({ label: 'Thanks after delivery', text: `Thanks for ordering with Overdriveauto, ${n}! If anything isn't right with order ${o.no}, reply here and we'll sort it out.` });
  return list;
}

/* ---------- Shell, gate and navigation ---------- */
function counts() {
  return {
    orders: st.orders.filter(o => o.status === 'new').length,
    requests: st.requests.filter(r => r.status === 'new').length,
    sellers: st.sellers.filter(s => s.status === 'new').length,
    stock: darProducts().filter(p => ['low', 'out'].includes(stockState(p.id))).length
  };
}
function renderNav() {
  const c = counts();
  $('#o-nav').innerHTML = VIEWS.map(v => `<button type="button" class="o-navlink" data-oview="${v.k}"${st.view === v.k ? ' aria-current="page"' : ''}>${OI[v.k]}<span>${esc(v.label)}</span>${c[v.k] ? `<span class="o-badge" aria-label="${c[v.k]} need attention">${c[v.k]}</span>` : ''}</button>`).join('');
  $('#o-tabs').innerHTML = TABS.map(k => {
    const v = VIEWS.find(x => x.k === k) || { k: 'more', label: 'More' };
    const cur = st.view === k || (k === 'more' && ['sellers', 'costs', 'settings', 'more'].includes(st.view));
    const b = k === 'more' ? c.sellers : c[k];
    return `<button type="button" class="o-tab" data-oview="${k}"${cur ? ' aria-current="page"' : ''}>${OI[k]}<span>${esc(v.short || v.label)}</span>${b ? `<span class="o-dot">${b}</span>` : ''}</button>`;
  }).join('');
}
function renderGate(kind) {
  st.gate = kind;
  root.classList.add('o-gated');
  const msg = {
    loading: ['Opening operations', 'Connecting to your orders…', false],
    noconfig: ['Connect your database', 'Add your Supabase project URL and publishable key to config.js, then reload this page.', false],

const FILL = {};
FILL.overview = () => {
  const start = periodStart(st.period);
  const all = st.orders.filter(o => o.status !== 'cancelled');
  const inP = all.filter(o => Date.parse(o.createdAt) >= start);
  const sales = sum(inP, o => o.total), parts = sum(inP, partsOf), profit = sum(inP, profitOf);
  const collected = sum(st.orders.flatMap(o => o.payments || []).filter(p => Date.parse(p.at) >= start), p => p.amount);
  const open = st.orders.filter(isActive);
  const owed = sum(open, balanceOf);
  const est = inP.some(o => (o.items || []).some(costIsEst));
  const periodLabel = (PERIODS.find(p => p[0] === st.period) || PERIODS[2])[1].toLowerCase();

    <div class="o-stat"><span class="l">Gross profit<em>TZS</em></span><span class="v">${n0(profit)}</span><span class="s">${pct(profit, parts)}% margin on parts${est ? ' · some costs estimated' : ''}</span></div>
    <div class="o-stat"><span class="l">Orders</span><span class="v">${inP.length}</span><span class="s">${open.length} open right now</span></div>

};
function attentionPanel() {
  const items = [];

  const by = k => st.orders.filter(o => o.status === k);
  add(by('new').length, 'New orders to confirm', 'Check stock and fitment, then message the customer', 'orders:new', 'warn');
  add(by('confirmed').length, 'Waiting for payment', 'Confirmed but not paid yet', 'orders:confirmed');
  const paidImp = by('paid').filter(isImport).length, paidLocal = by('paid').length - paidImp;
  add(paidImp, 'Paid, order from supplier', 'Japan, Canada or China parts to buy', 'orders:paid', 'warn');
  add(paidLocal, 'Paid, ready to pack', 'Dar stock and Kariakoo parts', 'orders:paid', 'warn');
  const stuck = by('clearing').filter(o => { const h = (o.history || []).filter(x => x.status === 'clearing').pop(); return h && Date.now() - Date.parse(h.at) > 5 * 864e5; }).length;
  add(stuck, 'Stuck in clearing over 5 days', 'Chase the clearing agent', 'orders:clearing', 'bad');
  add(st.orders.filter(o => o.status === 'delivered' && balanceOf(o) > 0).length, 'Balances to collect', 'Delivered but not fully paid', 'orders:delivered', 'warn');

function dailyPanel(all) {

  const value = sum(tracked, p => stockRow(p.id).qty * unitCost({ pid: p.id, src: p.src, price: p.price }));
  const low = items.filter(p => stockState(p.id) === 'low').length, out = items.filter(p => stockState(p.id) === 'out').length;

  return `<div class="o-stats" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
      <div class="o-stat"><span class="l">Stock value at cost<em>TZS</em></span><span class="v">${n0(value)}</span><span class="s">${tracked.length} of ${items.length} parts tracked</span></div>
      <div class="o-stat"><span class="l">Running low</span><span class="v">${low}</span><span class="s">At or below reorder level</span></div>
      <div class="o-stat"><span class="l">Out of stock</span><span class="v">${out}</span><span class="s">Shown as "Request it" on the store</span></div>
    </div>
    <section class="o-panel"><div class="o-stock">
      <div class="o-srow head"><span>Part</span><span>On the shelf</span><span>Reorder at</span><span>In open orders</span><span>Status</span></div>
      ${items.map(p => { const r = stockRow(p.id), res = reservedQty(p.id); return `<div class="o-srow">
        <span class="nm">${esc(p.name)}<span class="o-sub">${esc(p.brand)} · ${esc(p.oem[0])} · ${fmt(p.price)}</span></span>
        <span><span class="lbl">On the shelf</span><span class="o-step"><button type="button" data-sq="${p.id}" data-d="-1" aria-label="One less ${esc(p.name)}">−</button><input class="input" type="number" min="0" inputmode="numeric" data-sqty="${p.id}" value="${r.qty === null ? '' : r.qty}" placeholder="—" aria-label="${esc(p.name)} on the shelf"><button type="button" data-sq="${p.id}" data-d="1" aria-label="One more ${esc(p.name)}">+</button></span></span>
        <span><span class="lbl">Reorder at</span><input class="input" type="number" min="0" inputmode="numeric" data-smin="${p.id}" value="${r.min}" aria-label="Reorder level for ${esc(p.name)}"></span>
        <span class="res"><span class="lbl">In open orders</span>${res ? `${res} reserved${r.qty !== null ? ` · ${Math.max(0, r.qty - res)} free` : ''}` : '<span class="o-sub" style="display:inline">None</span>'}</span>
        <span>${pill(stockState(p.id))}</span>
      </div>`; }).join('')}
    </div></section>
    <p class="hint">Only parts listed as "In stock in Dar" are tracked here. Changes save automatically and update the store within seconds.</p>`;
};

FILL.sellers = () => {
  if (!st.loaded.sellers) return '<p class="hint">Loading sign-ups…</p>';
  const f = st.sellerFilter;
  const isOpen = s => s.status === 'new' || s.status === 'contacted';
  const cnt = k => st.sellers.filter(s => k === 'open' ? isOpen(s) : k === 'all' ? true : s.status === k).length;
  let out = `<div class="row" role="group" aria-label="Status">${[['open', 'Open'], ['approved', 'Approved'], ['declined', 'Declined'], ['all', 'All']].map(([k, l]) => `<button type="button" class="chip${cnt(k) ? '' : ' empty-chip'}" data-sfilter="${k}" aria-pressed="${f === k}">${l} <span class="n">${cnt(k)}</span></button>`).join('')}</div>`;
  const list = st.sellers.filter(s => f === 'open' ? isOpen(s) : f === 'all' ? true : s.status === f);

/* ---------- Order drawer ---------- */
function openOrder(id) {
  st.drawer = { id }; st.confirm = null;
  scrim.hidden = false; drawer.hidden = false;
  document.body.style.overflow = 'hidden';
  if (st.fresh.has(id)) st.fresh.delete(id);
  renderDrawer('open');
}
function closeOrder() {
  st.drawer = null; st.confirm = null;
  scrim.hidden = true; drawer.hidden = true; drawer.innerHTML = '';
  document.body.style.overflow = '';
}
function renderDrawer(force) {
  const o = st.drawer && st.orders.find(x => x.id === st.drawer.id);
  if (!o) { if (st.drawer && st.loaded.orders) closeOrder(); return; }
  const a = document.activeElement;
  if (!force && a && drawer.contains(a) && a.matches('input, textarea, select')) { drawer.dataset.stale = '1'; return; }
  drawer.dataset.stale = '';
  const scrollTop = $('.o-dr-body', drawer) ? $('.o-dr-body', drawer).scrollTop : 0;
  const stages = stagesFor(o), cur = stages.findIndex(s => s.k === o.status);
  const hist = k => (o.history || []).filter(h => h.status === k).pop();
  const nx = nextStage(o), pv = prevStage(o), label = nextLabel(o);
  const c = o.customer || {};
  const due = dueNowLeft(o), bal = balanceOf(o), paid = paidOf(o);
  const parts = partsOf(o), profit = profitOf(o);
  const tpls = templates(o);
  const suggest = (o.status === 'new' || o.status === 'confirmed') ? (due || bal) : bal;
  let confirmBox = '';
  if (st.confirm === 'cancel') confirmBox = `<div class="o-confirm"><p>Cancel ${esc(o.no)}?${o.stockDeducted ? ' Its Dar stock goes back on the shelf.' : ''}${paid ? ` You've received ${fmt(paid)} on this order, so arrange a refund with the customer.` : ''}</p><div class="btn-row"><button type="button" class="btn btn-danger btn-sm" data-act="cancel-yes">Cancel order</button><button type="button" class="btn btn-ghost btn-sm" data-act="confirm-no">Keep it</button></div></div>`;
  if (st.confirm === 'close') confirmBox = `<div class="o-confirm"><p>${esc(o.no)} still has ${fmt(bal)} unpaid. Record the payment first, or close it anyway.</p><div class="btn-row"><button type="button" class="btn btn-danger btn-sm" data-act="close-yes">Close anyway</button><button type="button" class="btn btn-ghost btn-sm" data-act="confirm-no">Go back</button></div></div>`;
  drawer.innerHTML = `
    <div class="o-dr-head"><h2 id="o-drawer-title">${esc(o.no)}</h2>${statusPill(o.status)}${o.example ? '<span class="o-ex">Example</span>' : ''}<button type="button" class="x" data-act="close" aria-label="Close order">${OI.close}</button></div>
    <div class="o-dr-body">
      <section class="o-panel" aria-label="Progress">
        <p class="hint" style="font-size:15px;color:var(--ink)">${esc((STAGE[o.status] || {}).doing || '')}</p>
        ${confirmBox}
        ${isActive(o) && !st.confirm ? `<div class="btn-row">${label ? `<button type="button" class="btn btn-primary" data-act="next">${esc(label)}</button>` : ''}${pv ? `<button type="button" class="btn btn-ghost" data-act="back">Back to ${esc(pv.label)}</button>` : ''}</div>` : ''}
        ${o.status === 'cancelled' ? '' : `<ol class="o-steps">${stages.map((s, i) => { const h = hist(s.k); return `<li class="${i < cur ? 'done' : i === cur ? 'cur' : ''}"><span class="d"></span><span>${esc(s.label)}</span><time>${h ? esc(when(h.at)) : ''}</time></li>`; }).join('')}</ol>`}
        ${isActive(o) && !st.confirm ? '<button type="button" class="o-plain" data-act="cancel">Cancel this order</button>' : ''}
      </section>

      <section class="o-panel" aria-labelledby="o-cust-h"><h2 id="o-cust-h">Customer</h2>
        <dl class="o-kv">
          <dt>Name</dt><dd>${esc(c.name || '')}</dd>
          <dt>WhatsApp</dt><dd><a href="${esc(waTo(c.phone))}" target="_blank" rel="noopener">${esc(c.phone || '')}</a><button type="button" class="copy-mini" data-copy-text="${esc(c.phone || '')}">Copy</button></dd>
          ${c.area ? `<dt>Area</dt><dd>${esc(c.area)}</dd>` : ''}
          ${o.vehicle ? `<dt>Vehicle</dt><dd>${esc(o.vehicle)}</dd>` : ''}
          ${o.chassis ? `<dt>Chassis</dt><dd><span class="o-mono">${esc(o.chassis)}</span><button type="button" class="copy-mini" data-copy-text="${esc(o.chassis)}">Copy</button></dd>` : ''}
          <dt>Placed</dt><dd>${esc(when(o.createdAt))}</dd>
          <dt>Delivery</dt><dd>${esc((o.delivery && o.delivery.label) || '')}</dd>
          <dt>Pays by</dt><dd>${esc((PAY[o.payMethod] || {}).label || o.payMethod || '')}</dd>
        </dl>
        <div><p class="hint" style="margin-bottom:8px">Message the customer on WhatsApp:</p><div class="o-tpls">${tpls.map(t => `<a class="chip" href="${esc(waTo(c.phone, t.text))}" target="_blank" rel="noopener">${I.chat}${esc(t.label)}</a>`).join('')}</div></div>
      </section>

      <section class="o-panel" aria-labelledby="o-parts-h"><h2 id="o-parts-h">Parts <small>${o.trade ? 'Trade prices' : ''}</small></h2>
        <div class="o-tablewrap"><table class="o-table"><thead><tr><th>Part</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Your cost</th><th class="num">Profit</th></tr></thead><tbody>
          ${(o.items || []).map((i, n) => `<tr><td>${esc(i.name)}<span class="o-sub">${esc(i.brand || '')} · ${esc(i.oem || '')}</span><span class="o-sub">${srcTag(i.src)}</span></td><td class="num">${i.qty}</td><td class="num">${fmt(i.price)}</td><td class="num"><input class="input o-costin" type="number" min="0" step="100" inputmode="numeric" data-icost="${n}" value="${costIsEst(i) ? '' : unitCost(i)}" placeholder="${unitCost(i)}" aria-label="Your cost for ${esc(i.name)}">${costIsEst(i) ? '<span class="o-est" style="display:block">estimate</span>' : ''}</td><td class="num">${fmt((num(i.price) - unitCost(i)) * num(i.qty))}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="o-sum">
          <div><span>Parts</span><span>${fmt(parts)}</span></div>
          <div><span>${esc((o.delivery && o.delivery.label) || 'Delivery')}</span><span>${o.delivery && o.delivery.fee ? fmt(o.delivery.fee) : 'Free'}</span></div>
          <div class="tot"><span>Total</span><span>${fmt(o.total)}</span></div>
          <div class="pos"><span>Profit on parts</span><span>${fmt(profit)} · ${pct(profit, parts)}%</span></div>
        </div>
        <div><button type="button" class="btn btn-ghost btn-sm" data-act="save-costs">Save costs</button></div>
      </section>

      <section class="o-panel" aria-labelledby="o-pay-h"><h2 id="o-pay-h">Payments <small>${fmt(paid)} of ${fmt(o.total)}</small></h2>
        <div class="o-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct(paid, o.total)}" aria-label="Paid"><span style="width:${Math.min(100, pct(paid, o.total))}%"></span></div>
        <div class="o-sum">
          <div><span>Due now${num(o.later) ? ' (deposit)' : ''}</span><span>${due ? fmt(due) : 'Paid'}</span></div>
          <div><span>Balance</span><span>${bal ? fmt(bal) : 'Nothing owed'}</span></div>
        </div>
        ${(o.payments || []).length ? `<ul class="fit-list">${o.payments.map(p => `<li>${I.check}<span>${fmt(p.amount)} by ${esc((PAY[p.method] || {}).label || p.method)} · ${esc(when(p.at))}${p.note ? ' · ' + esc(p.note) : ''}</span></li>`).join('')}</ul>` : ''}
        ${bal && o.status !== 'cancelled' ? `<form class="o-pay" data-payform novalidate>
          <label class="f">Amount (TZS)<input class="input" name="amount" type="number" min="0" step="100" inputmode="numeric" value="${suggest || ''}" id="o-payamt"></label>
          <label class="f">Method<select name="method">${Object.entries(PAY).map(([k, p]) => `<option value="${k}"${(o.payMethod || 'mobile') === k ? ' selected' : ''}>${esc(p.label)}</option>`).join('')}</select></label>
          <label class="f full">Note <span class="opt-tag">(optional)</span><input class="input" name="note" placeholder="e.g. M-Pesa ref QHX4…"></label>
          <p class="err full" data-payerr hidden></p>
          <div class="full"><button type="submit" class="btn btn-primary btn-sm">Record payment</button></div>
        </form>` : ''}
      </section>

      ${isImport(o) ? `<section class="o-panel" aria-labelledby="o-sup-h"><h2 id="o-sup-h">Supplier and shipping</h2>
        <div class="o-pay">
          <label class="f">Supplier order number<input class="input" id="o-supref" value="${esc((o.supplier && o.supplier.ref) || '')}" placeholder="e.g. AM-559201"></label>
          <label class="f">Tracking number<input class="input" id="o-track" value="${esc((o.supplier && o.supplier.tracking) || '')}" placeholder="e.g. DHL 1234567890"></label>
        </div>
        <div><button type="button" class="btn btn-ghost btn-sm" data-act="save-supplier">Save</button></div>
      </section>` : ''}

      <section class="o-panel" aria-labelledby="o-note-h"><h2 id="o-note-h">Notes</h2>
        <label class="f"><span class="vh">Notes</span><textarea class="input" id="o-note" rows="3" placeholder="Only you see these">${esc(o.note || '')}</textarea></label>
        <div><button type="button" class="btn btn-ghost btn-sm" data-act="save-note">Save notes</button></div>
      </section>
    </div>`;
  if (scrollTop) $('.o-dr-body', drawer).scrollTop = scrollTop;
  if (force === 'open') { const x = $('[data-act="close"]', drawer); if (x) x.focus(); }
}
drawer.addEventListener('focusout', () => setTimeout(() => { if (drawer.dataset.stale === '1' && !(document.activeElement && drawer.contains(document.activeElement) && document.activeElement.matches('input, textarea, select'))) renderDrawer(); }, 0));
drawer.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const o = st.drawer && st.orders.find(x => x.id === st.drawer.id); if (!o) return;
  const act = b.dataset.act;
  try {
    if (act === 'close') { closeOrder(); return; }
    if (act === 'next') {
      if (o.status === 'confirmed') { const f = $('#o-payamt', drawer); if (f) { f.focus(); f.select(); } return; }
      if (o.status === 'delivered' && balanceOf(o) > 0) { st.confirm = 'close'; renderDrawer(true); return; }
      const nx = nextStage(o); if (nx) { b.disabled = true; await setStatus(o, nx.k); }
      return;
    }
    if (act === 'back') { const pv = prevStage(o); if (pv) { b.disabled = true; await setStatus(o, pv.k, 'Moved back'); } return; }
    if (act === 'cancel') { st.confirm = 'cancel'; renderDrawer(true); return; }
    if (act === 'confirm-no') { st.confirm = null; renderDrawer(true); return; }
    if (act === 'cancel-yes') { st.confirm = null; b.disabled = true; await setStatus(o, 'cancelled'); return; }
    if (act === 'close-yes') { st.confirm = null; b.disabled = true; await setStatus(o, 'closed', 'Closed with balance unpaid'); return; }
    if (act === 'save-costs') {
      const items = (o.items || []).map((i, n) => { const inp = $(`[data-icost="${n}"]`, drawer); const v = inp && inp.value.trim() !== '' ? Math.max(0, Math.round(+inp.value)) : null; const c = Object.assign({}, i); if (v === null || !isFinite(v)) delete c.cost; else c.cost = v; return c; });
      b.disabled = true; await write('orders/' + o.id, 'update', { items, updatedAt: new Date().toISOString() });
      if (document.activeElement) document.activeElement.blur();
      toast('Costs saved'); renderDrawer(true); return;
    }
    if (act === 'save-supplier') {
      b.disabled = true;
      await write('orders/' + o.id, 'update', { supplier: { ref: $('#o-supref', drawer).value.trim(), tracking: $('#o-track', drawer).value.trim() }, updatedAt: new Date().toISOString() });
      toast('Supplier details saved'); renderDrawer(true); return;
    }
    if (act === 'save-note') {
      b.disabled = true;
      await write('orders/' + o.id, 'update', { note: $('#o-note', drawer).value.trim(), updatedAt: new Date().toISOString() });
      toast('Notes saved'); renderDrawer(true); return;
    }
  } catch (err) { b.disabled = false; }
});
drawer.addEventListener('submit', async e => {
  const f = e.target.closest('[data-payform]'); if (!f) return;
  e.preventDefault();
  const o = st.drawer && st.orders.find(x => x.id === st.drawer.id); if (!o) return;
  const amount = Math.round(+f.amount.value);
  const err = $('[data-payerr]', f);
  if (!(amount > 0)) { err.textContent = 'Enter the amount you received, in shillings.'; err.hidden = false; f.amount.focus(); return; }
  if (amount > balanceOf(o)) { err.textContent = `That's more than the ${fmt(balanceOf(o))} still owed on this order.`; err.hidden = false; f.amount.focus(); return; }
  err.hidden = true;
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  try { await recordPayment(o, amount, f.method.value, f.note.value.trim()); if (document.activeElement) document.activeElement.blur(); renderDrawer(true); }
  catch (e2) { btn.disabled = false; }
});

/* ---------- Events ---------- */
root.addEventListener('click', async e => {
  const t = e.target;
  const v = t.closest('[data-oview]'); if (v) { e.preventDefault(); setView(v.dataset.oview); return; }
  const go = t.closest('[data-go]');
  if (go) {
    const [view, filter] = go.dataset.go.split(':');
    if (view === 'orders') { st.orderFilter = filter || 'active'; st.q = ''; st.srcFilter = 'all'; if (filter && filter !== 'all' && filter !== 'active') st.layout = 'list'; }
    if (view === 'requests') st.reqFilter = filter || 'open';
    if (view === 'sellers') st.sellerFilter = filter === 'new' ? 'open' : (filter || 'open');
    shellFor = null; setView(view); return;
  }
  const ord = t.closest('[data-order]'); if (ord && !drawer.contains(ord)) { openOrder(ord.dataset.order); return; }
  const per = t.closest('[data-period]'); if (per) { st.period = per.dataset.period; fill(); return; }
  const lay = t.closest('[data-layout]');
  if (lay) { st.layout = lay.dataset.layout; $$('#o-layout [data-layout]').forEach(x => x.setAttribute('aria-pressed', String(x === lay))); fill(); return; }
  const of = t.closest('[data-ofilter]'); if (of) { st.orderFilter = of.dataset.ofilter; fill(); return; }
  if (t.closest('[data-oreset]')) { st.orderFilter = 'active'; st.srcFilter = 'all'; st.q = ''; shellFor = null; render(); return; }
  const rf = t.closest('[data-rfilter]'); if (rf) { st.reqFilter = rf.dataset.rfilter; st.quoting = null; fill(); return; }
  const sf = t.closest('[data-sfilter]'); if (sf) { st.sellerFilter = sf.dataset.sfilter; fill(); return; }
  const ra = t.closest('[data-ract]');
  if (ra) {
    const r = st.requests.find(x => x.id === ra.dataset.id); if (!r) return;
    const act = ra.dataset.ract;
    if (act === 'quote') { st.quoting = r.id; fill(); const inp = $(`[data-qform="${CSS.escape(r.id)}"] [name=price]`, main); if (inp) inp.focus(); return; }
    if (act === 'cancelq') { st.quoting = null; if (document.activeElement) document.activeElement.blur(); fill(); return; }
    const status = act === 'reopen' ? (r.quote ? 'quoted' : 'new') : act;
    ra.disabled = true;
    try { await write('requests/' + r.id, 'update', { status, updatedAt: new Date().toISOString() }); toast(`${r.no} marked ${REQ_STATUS[status].toLowerCase()}`); } catch (err) { ra.disabled = false; }
    return;
  }
  const sq = t.closest('[data-sq]');
  if (sq) {
    const pid = sq.dataset.sq, r = stockRow(pid);
    const qty = Math.max(0, (r.qty === null ? 0 : r.qty) + +sq.dataset.d);
    st.stock = Object.assign({}, st.stock, { [pid]: { qty, min: r.min } });
    fill(); renderNav(); saveLater('stock', writeStock);
    return;
  }
  const sns = t.closest('[data-snotesave]');
  if (sns) {
    const s = st.sellers.find(x => x.id === sns.dataset.snotesave); if (!s) return;
    const ta = $(`[data-snote="${CSS.escape(s.id)}"]`, main);
    sns.disabled = true;
    try { await write('sellers/' + s.id, 'update', { note: ta.value.trim(), updatedAt: new Date().toISOString() }); ta.blur(); toast('Notes saved'); } catch (err) {} sns.disabled = false;
    return;
  }
  if (t.closest('[data-savepay]')) {
    const ta = $('#o-payinfo', main);
    try { await write('private/settings', 'set', Object.assign({}, st.settings, { payInfo: ta.value.trim(), updatedAt: new Date().toISOString() })); ta.blur(); toast('Payment details saved'); } catch (err) {}
    return;
  }
  if (t.closest('[data-export]')) { exportCsv(); return; }
  const cx = t.closest('[data-clearex]');
  if (cx) {
    if (cx.dataset.clearex === 'ask') { st.clearConfirm = true; fill(); return; }
    if (cx.dataset.clearex === 'no') { st.clearConfirm = false; fill(); return; }
    st.clearConfirm = false;
    const paths = [...st.orders.filter(o => o.example).map(o => 'orders/' + o.id), ...st.requests.filter(r => r.example).map(r => 'requests/' + r.id), ...st.sellers.filter(s => s.example).map(s => 'sellers/' + s.id)];
    toast(`Removing ${paths.length} example records…`);
    let ok = 0;
    for (const p of paths) { try { await write(p, 'delete'); ok++; } catch (err) {} }
    toast(`Removed ${ok} example records`);
    return;
  }
});
root.addEventListener('keydown', e => {
  const row = e.target.closest && e.target.closest('tr[data-order]');
  if (row && (e.key === 'Enter' || e.key === ' ') && e.target === row) { e.preventDefault(); openOrder(row.dataset.order); }
});
root.addEventListener('input', e => {
  if (e.target.id === 'o-q') { st.q = e.target.value; fill(); }
  if (e.target.id === 'o-cq') { st.costQ = e.target.value; fill(); }
});
root.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'o-srcf') { st.srcFilter = t.value; fill(); return; }
  if (t.dataset.sqty !== undefined) {
    const pid = t.dataset.sqty, r = stockRow(pid);
    const items = Object.assign({}, st.stock);
    if (t.value.trim() === '') delete items[pid]; else items[pid] = { qty: Math.max(0, Math.round(+t.value) || 0), min: r.min };
    st.stock = items; renderNav(); saveLater('stock', writeStock); return;
  }
  if (t.dataset.smin !== undefined) {
    const pid = t.dataset.smin, r = stockRow(pid);
    st.stock = Object.assign({}, st.stock, { [pid]: { qty: r.qty === null ? 0 : r.qty, min: Math.max(0, Math.round(+t.value) || 0) } });
    renderNav(); saveLater('stock', writeStock); return;
  }
  if (t.dataset.cost !== undefined) {
    const pid = t.dataset.cost, costs = Object.assign({}, st.costs);
    if (t.value.trim() === '') delete costs[pid]; else costs[pid] = Math.max(0, Math.round(+t.value) || 0);
    st.costs = costs; saveLater('costs', writeCosts); return;
  }
  if (t.dataset.sstatus !== undefined) {
    const s = st.sellers.find(x => x.id === t.dataset.sstatus); if (!s) return;
    try { await write('sellers/' + s.id, 'update', { status: t.value, updatedAt: new Date().toISOString() }); t.blur(); toast(`${s.shop} marked ${SELL_STATUS[t.value].toLowerCase()}`); } catch (err) {}
  }
});
main.addEventListener('submit', async e => {
  const f = e.target.closest('[data-qform]'); if (!f) return;
  e.preventDefault();
  const r = st.requests.find(x => x.id === f.dataset.qform); if (!r) return;
  const price = Math.round(+f.price.value), err = $('[data-qerr]', f);
  if (!(price > 0)) { err.textContent = 'Enter the price you\'ll charge, in shillings.'; err.hidden = false; f.price.focus(); return; }
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  try {
    await write('requests/' + r.id, 'update', { status: 'quoted', quote: { price, src: f.src.value, eta: f.eta.value.trim(), at: new Date().toISOString() }, updatedAt: new Date().toISOString() });
    st.quoting = null; if (document.activeElement) document.activeElement.blur();
    toast(`Quote saved for ${r.no}. Send it on WhatsApp next.`); fill();
  } catch (e2) { btn.disabled = false; }
});
scrim.addEventListener('click', closeOrder);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !drawer.hidden) { closeOrder(); } });

/* Tooltips for chart marks */
function showTip(el) {
  const [a, b, c] = (el.dataset.tip || '').split('|');
  tip.innerHTML = `<b>${esc(b || '')}</b>${esc(a || '')}${c ? '<br>' + esc(c) : ''}`;
  tip.hidden = false;
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  const left = Math.min(window.innerWidth - w - 8, Math.max(8, r.left + r.width / 2 - w / 2));
  const top = r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
root.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
root.addEventListener('mouseout', e => { const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) tip.hidden = true; });
root.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
root.addEventListener('focusout', e => { if (e.target.closest('[data-tip]')) tip.hidden = true; });
window.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });

/* ---------- Export ---------- */
function csvCell(v) {
  let s = v == null ? '' : String(v);
  if (/^[=+\-@]/.test(s)) s = "'" + s;
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
async function exportCsv() {
  if (!st.downloads) { toast('Saving files isn\'t available here.'); return; }
  const headRow = ['Order', 'Placed', 'Status', 'Customer', 'WhatsApp', 'Area', 'Vehicle', 'Chassis', 'Parts', 'Sources', 'Parts total (TZS)', 'Delivery (TZS)', 'Total (TZS)', 'Paid (TZS)', 'Balance (TZS)', 'Profit on parts (TZS)', 'Example'];
  const rows = st.orders.map(o => [o.no, o.createdAt, (STAGE[o.status] || {}).label || o.status, o.customer && o.customer.name, o.customer && o.customer.phone, o.customer && o.customer.area, o.vehicle, o.chassis, (o.items || []).map(i => `${i.qty} x ${i.name} (${i.oem})`).join('; '), [...new Set((o.items || []).map(i => (SRC[i.src] || {}).label || i.src))].join('; '), partsOf(o), (o.delivery && o.delivery.fee) || 0, num(o.total), paidOf(o), balanceOf(o), profitOf(o), o.example ? 'yes' : '']);
  const csv = [headRow, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
  try { await st.downloads.save({ filename: `overdriveauto-orders-${new Date().toISOString().slice(0, 10)}.csv`, data: '﻿' + csv }); toast('Orders exported'); }
  catch (e) {
    if (e && e.code === 'declined') return;
    toast(e && e.code === 'rate_limited' ? 'A save is already open. Finish it, then try again.' : 'Saving files isn\'t available here.');
  }
}

/* ---------- Live data ---------- */
function subscribe() {
  const db = st.db;
  const onErr = what => e => { if (e && e.code === 'revoked') renderGate('revoked'); else toast(`Live updates for ${what} stopped. Reload the page to reconnect.`); };
  db.collection('orders').orderBy('createdAt', 'desc').limit(1000).onSnapshot(snap => {
    const list = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
    if (st.seen) list.forEach(o => { if (!st.seen.has(o.id) && o.status === 'new' && !o.example) { st.fresh.add(o.id); toast(`New order ${o.no} from ${(o.customer && o.customer.name) || 'a customer'}`, { label: 'Open', fn: () => openOrder(o.id) }); } });
    st.seen = new Set(list.map(o => o.id));
    st.orders = list; st.loaded.orders = true; render();
  }, onErr('orders'));
  db.collection('requests').orderBy('createdAt', 'desc').limit(500).onSnapshot(snap => {
    const list = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
    if (st.loaded.requests) list.forEach(r => { if (r.status === 'new' && !st.requests.some(x => x.id === r.id) && !r.example) toast(`New part request ${r.no}: ${r.part}`); });
    st.requests = list; st.loaded.requests = true; render();
  }, onErr('part requests'));
  db.collection('sellers').orderBy('createdAt', 'desc').limit(500).onSnapshot(snap => {
    st.sellers = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id })); st.loaded.sellers = true; render();
  }, onErr('seller sign-ups'));
  db.doc('shared/stock').onSnapshot(s => { if (!st.pending.stock) { st.stock = (s.exists && s.data().items) || {}; render(); } }, onErr('stock'));
  db.doc('private/costs').onSnapshot(s => { if (!st.pending.costs) { st.costs = (s.exists && s.data().costs) || {}; render(); } }, onErr('costs'));
  db.doc('private/settings').onSnapshot(s => { st.settings = (s.exists && s.data()) || {}; render(); }, onErr('settings'));
}
async function openOps() {
  document.title = 'Ops · Overdriveauto';
  if (st.started) { render(); return; }
  if (O.AUTH) {
    if (!O.AUTH.configured) { renderGate('noconfig'); return; }
    renderGate('loading');
    if (await O.AUTH.restore()) { start(O.AUTH.cloud()); return; }
    renderLogin(); return;
  }
  renderGate('loading');
  const c = await O.CLOUD;
  if (!c || !c.db) { renderGate('nodb'); return; }
  if (!c.owner) { renderGate('owner'); return; }
  start(c);
}
function start(c) {
  st.db = c.db; st.downloads = c.downloads; st.started = true; st.gate = 'ready';
  if (st.view === 'more' && window.innerWidth > 860) st.view = 'overview';
  try { subscribe(); } catch (e) { renderGate('nodb'); return; }
  render();
}
function renderLogin(msg) {
  st.gate = 'login'; root.classList.add('o-gated'); shellFor = null;
  main.innerHTML = `<form class="o-gate" id="o-login" novalidate>
    <h1>Sign in</h1>
    <p>Overdriveauto operations. Only the owner's account can open this.</p>
    <label class="f" style="width:100%">Email<input class="input" type="email" id="o-email" autocomplete="username" spellcheck="false"></label>
    <label class="f" style="width:100%">Password<input class="input" type="password" id="o-pw" autocomplete="current-password"></label>
    <p class="err" id="o-login-err"${msg ? '' : ' hidden'}>${esc(msg || '')}</p>
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>`;
  const em = $('#o-email'); if (em) em.focus();
}
root.addEventListener('submit', async e => {
  const f = e.target.closest('#o-login'); if (!f || !O.AUTH) return;
  e.preventDefault();
  const email = $('#o-email').value.trim(), pw = $('#o-pw').value, errEl = $('#o-login-err');
  if (!email || !pw) { errEl.textContent = 'Enter your email and password.'; errEl.hidden = false; (email ? $('#o-pw') : $('#o-email')).focus(); return; }
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Signing in…';
  const r = await O.AUTH.signIn(email, pw);
  if (r.ok) { toast('Signed in'); start(O.AUTH.cloud()); return; }
  btn.disabled = false; btn.textContent = 'Sign in';
  errEl.textContent = r.reason === 'notadmin' ? "This account doesn't have access to Overdriveauto operations." : r.reason === 'network' ? "Can't reach the database. Check your connection and try again." : "That email and password don't match.";
  errEl.hidden = false; $('#o-pw').value = ''; $('#o-pw').focus();
});
root.addEventListener('click', async e => {
  if (!e.target.closest('[data-signout]') || !O.AUTH) return;
  await O.AUTH.signOut(); location.reload();
});

/* ---------- Routing between the store and operations ---------- */
function route() {
  const ops = location.hash === '#ops';
  $('#store-app').hidden = ops;
  root.hidden = !ops;
  tip.hidden = true;
  if (ops) { O.closeDrawers(false); window.scrollTo(0, 0); openOps(); }
  else {
    closeOrder();
    document.title = 'Overdriveauto';
    const id = location.hash.slice(1);
    const el = id && document.getElementById(id);
    if (el) requestAnimationFrame(() => el.scrollIntoView({ block: 'start' }));
  }
}
if (O.standalone) { root.hidden = false; openOps(); }
else { window.addEventListener('hashchange', route); route(); }
})();
</script>
